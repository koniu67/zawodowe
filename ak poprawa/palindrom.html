<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        function isPalindrome(text) {
            const cleaned = text
                .toLowerCase()
                .replace(/\s+/g, '');

            const reversed = cleaned
                .split('')
                .reverse()
                .join('');

            return cleaned === reversed;
        }
    </script>
</head>
